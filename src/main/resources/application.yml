spring:
  application:
    name: closetnangam-BE

  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  data:
    redis:
      timeout: 6000ms

server:
  port: 8080

jwt:
  expiration:
    access: 3600000
    refresh: 604800000

gemini:
  api-key: ${GEMINI_API_KEY:}
  base-url: https://generativelanguage.googleapis.com/v1beta
  model: gemini-2.0-flash

weather:
  api:
    key: ${WEATHER_API_KEY:}
    url: ${WEATHER_API_URL:https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0}

kind: Application

