spring:
  application:
    name: closetnangam-BE

  profiles:
    active: local

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  data:
    redis:
      timeout: 6000ms

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

jwt:
  expiration:
    access: 3600000
    refresh: 604800000

gemini:
  api-key: ${GEMINI_API_KEY:}
  # 할당량 초과(429) 또는 키 오류 시 순서대로 시도한다. 비어 있는 값은 자동 제외된다.
  api-keys:
    - ${GEMINI_API_KEY:}
    - ${GEMINI_API_KEY_2:}
    - ${GEMINI_API_KEY_3:}
  base-url: https://generativelanguage.googleapis.com/v1beta
  model: gemini-3.5-flash
  fallback-models:
    - gemini-2.5-flash
    - gemini-2.0-flash

app:
  oauth2:
    redirect-uri: http://localhost:3000
  storage:
    local:
      base-path: uploads
      base-url: http://localhost:8080/api/v1/images
    clothes:
      max-size: 10485760
      allowed-content-types:
        - image/jpeg
        - image/png
        - image/webp
      allowed-extensions:
        - jpg
        - jpeg
        - png
        - webp

weather:
  api:
    key: ${WEATHER_API_KEY:}
    url: ${WEATHER_API_URL:https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0/getUltraSrtFcst}

kind: Application