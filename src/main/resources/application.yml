spring:
  application:
    name: closetnangam-BE

  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  data:
    redis:
      timeout: 6000ms

server:
  port: 8080

jwt:
  expiration:
    access: 3600000
    refresh: 604800000

kind: Application

