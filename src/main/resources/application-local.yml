spring:
  autoconfigure:
    exclude:
      - io.awspring.cloud.autoconfigure.s3.S3AutoConfiguration
      - io.awspring.cloud.autoconfigure.s3.S3TransferManagerAutoConfiguration

  datasource:
    url: jdbc:mysql://localhost:3307/closetnangamdb?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: http://localhost:8080/login/oauth2/code/kakao
            authorization-grant-type: authorization_code
            scope: account_email
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: http://localhost:8080/login/oauth2/code/google
            scope: profile, email
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: http://localhost:8080/login/oauth2/code/naver
            authorization-grant-type: authorization_code
            scope: name, email
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

cloud:
  aws:
    region:
      static: ap-northeast-2
    stack:
      auto: false

jwt:
  secret: ${JWT_SECRET}

gemini:
  api-key: ${GEMINI_API_KEY}

weather:
  api:
    key: ${WEATHER_API_KEY}
    url: ${WEATHER_API_URL:https://apis.data.go.kr/1360000/VilageFcstInfoService_2.0}

app:
  recommendation:
    complementary:
      # 동기 Gemini 분류(importComplementaryRecommendationCandidate) 사용 여부. false면 규칙 기반 fallback만 사용.
      ai-classification-enabled: true
      batch:
        # Gemini Batch API 대량 분류·적재. local에서 enabled=true 시 기동 후 자동 실행.
        enabled: false
        # submit | import | submit-and-wait
        mode: submit
        model: gemini-3.5-flash
        max-products: 1000
        # import 모드에서 state.json 대신 직접 지정할 때 사용 (예: batches/123456789)
        job-name:
        poll-interval-seconds: 30
        max-poll-attempts: 2880
        # uploadJsonl → createBatchJob 사이 Files API ACTIVE 대기 (기본 5초×60 = 5분)
        file-active-poll-interval-seconds: 5
        file-active-max-poll-attempts: 60
        state-dir: build/reco-004-batch